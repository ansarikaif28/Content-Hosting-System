<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete — Content Hosting System</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body data-page="login">
    <div data-login="container">
        <div data-login="card">
            <h1 data-login="title">PASSWORD RESET COMPLETE</h1>

            <div data-reset="info">
                <div data-reset="icon">✅</div>
                <p>Your password has been successfully reset.</p>
            </div>

            <a href="{% url 'login' %}" data-type="primary" data-width="full">
                LOGIN WITH NEW PASSWORD
            </a>
        </div>
    </div>
</body>
</html>
