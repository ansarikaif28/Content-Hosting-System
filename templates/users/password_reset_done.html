<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent — Content Hosting System</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body data-page="login">
    <div data-login="container">
        <div data-login="card">
            <h1 data-login="title">CHECK YOUR EMAIL</h1>

            <div data-reset="info">
                <div data-reset="icon">📧</div>
                <p>
                    If an account exists with the email you entered, we've sent
                    a password reset link.
                </p>
                <p data-reset="note">
                    <strong>Development mode:</strong> Check your terminal/console
                    output for the reset link.
                </p>
                <p data-reset="note">
                    The link will expire in <strong>3 days</strong>.
                </p>
            </div>

            <div data-reset="actions">
                <a href="{% url 'login' %}" data-type="primary" data-width="full">
                    RETURN TO LOGIN
                </a>
                <p data-reset="retry">
                    Didn't receive it?
                    <a href="{% url 'password_reset' %}">Send again</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
